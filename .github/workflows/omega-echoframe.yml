name: Build Omega Echoframe
on:
  push:
    branches: [ omega-echoframe-20260910 ]
    paths:
      - 'OmegaEchoframe/**'
      - '.github/workflows/omega-echoframe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: OmegaEchoframe
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: OmegaEchoframe-APK
          path: OmegaEchoframe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
