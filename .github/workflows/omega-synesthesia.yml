name: Omega Synesthesia APK
on:
  workflow_dispatch:
  push:
    branches: [omega-synesthesia-20260910]
    paths: ['OmegaSynesthesia/**', '.github/workflows/omega-synesthesia.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: OmegaSynesthesia
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: OmegaSynesthesia-APK
          path: OmegaSynesthesia/app/build/outputs/apk/debug/app-debug.apk
