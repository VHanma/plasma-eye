name: NHI Tech Forge APK Compiler

on:
  workflow_dispatch:
  push:
    branches:
      - rival3-nhi-matrix-build-v0.6
    paths:
      - '.github/workflows/nhi-matrix-apk.yml'
      - 'nhi-build/forge-overrides.b64.*'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact verified v0.5 foundation
        shell: bash
        run: |
          set -euo pipefail
          cat nhi-build/source.b64.* > /tmp/nhi-source.b64
          test "$(wc -c < /tmp/nhi-source.b64)" = "90928"
          base64 --decode /tmp/nhi-source.b64 > /tmp/nhi-source.zip
          echo '4ef025585f9f679cf07d9c6879efd4a5ceb155e249b8b914f025d6b843aaca63  /tmp/nhi-source.zip' | sha256sum -c -
          unzip -t /tmp/nhi-source.zip >/dev/null
          rm -rf /tmp/nhi-src
          mkdir -p /tmp/nhi-src
          unzip -q /tmp/nhi-source.zip -d /tmp/nhi-src

      - name: Verify and apply Rival 3 reverse-engineering overlay
        shell: bash
        run: |
          set -euo pipefail
          cat nhi-build/forge-overrides.b64.* > /tmp/forge-overrides.b64
          test "$(wc -c < /tmp/forge-overrides.b64)" = "21592"
          base64 --decode /tmp/forge-overrides.b64 > /tmp/forge-overrides.zip
          echo 'fb63129453db2a29b44cc67af39cb599633b11d6ec6c03fcbe25a8b28e7893fe  /tmp/forge-overrides.zip' | sha256sum -c -
          unzip -t /tmp/forge-overrides.zip >/dev/null
          rm -rf /tmp/forge-overrides
          mkdir -p /tmp/forge-overrides
          unzip -q /tmp/forge-overrides.zip -d /tmp/forge-overrides
          cp -R /tmp/forge-overrides/overrides/app/src/main/java/com/vhanma/nhimatrix/forge /tmp/nhi-src/NHI-Matrix-Lab/app/src/main/java/com/vhanma/nhimatrix/
          cp /tmp/forge-overrides/overrides/app/src/main/java/com/vhanma/nhimatrix/ui/ReverseEngineeringApp.kt /tmp/nhi-src/NHI-Matrix-Lab/app/src/main/java/com/vhanma/nhimatrix/ui/

      - name: Apply compiler, launcher and package fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path('/tmp/nhi-src/NHI-Matrix-Lab')

          # Keep legacy diagnostics source compiling even though the new launcher no longer centers it.
          p = src / 'app/src/main/java/com/vhanma/nhimatrix/ui/NhiMatrixApp.kt'
          s = p.read_text()
          s = s.replace('@Composable\nprivate fun LightLab() {', '@Composable\nprivate fun ColumnScope.LightLab() {')
          s = s.replace('@Composable\nprivate fun CloakLab() {', '@Composable\nprivate fun ColumnScope.CloakLab() {')
          p.write_text(s)

          main = src / 'app/src/main/java/com/vhanma/nhimatrix/MainActivity.kt'
          m = main.read_text()
          m = m.replace('import com.vhanma.nhimatrix.ui.NhiMatrixApp', 'import com.vhanma.nhimatrix.ui.ReverseEngineeringApp')
          m = m.replace('setContent { NhiMatrixApp() }', 'setContent { ReverseEngineeringApp() }')
          main.write_text(m)

          manifest = src / 'app/src/main/AndroidManifest.xml'
          x = manifest.read_text()
          if 'android.permission.VIBRATE' not in x:
              x = x.replace('<uses-permission android:name="android.permission.CAMERA" />', '<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />')
          x = x.replace('android:label="NHI Matrix Lab"', 'android:label="NHI Tech Forge"')
          manifest.write_text(x)

          g = src / 'app/build.gradle.kts'
          t = g.read_text()
          t = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.vhanma.nhiforge.r3"', t)
          t = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 7', t)
          t = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "0.6.0-rival3-techforge"', t)
          g.write_text(t)

          print('Launcher: ReverseEngineeringApp')
          print('Package: com.vhanma.nhiforge.r3')
          print('Version: 0.6.0-rival3-techforge')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android compile platform
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compile NHI Tech Forge APK
        shell: bash
        working-directory: /tmp/nhi-src/NHI-Matrix-Lab
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify install metadata and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/nhi-src/NHI-Matrix-Lab/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.vhanma.nhiforge.r3'" /tmp/apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apk-signature.txt
          unzip -t "$APK" >/tmp/apk-zip-test.txt

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/nhi-src/NHI-Matrix-Lab/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" /tmp/NHI-Tech-Forge-v0.6.0-rival3.apk
          sha256sum /tmp/NHI-Tech-Forge-v0.6.0-rival3.apk | tee /tmp/NHI-Tech-Forge-v0.6.0-rival3.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NHI-Tech-Forge-v0.6.0-rival3
          path: |
            /tmp/NHI-Tech-Forge-v0.6.0-rival3.apk
            /tmp/NHI-Tech-Forge-v0.6.0-rival3.apk.sha256
            /tmp/apk-badging.txt
            /tmp/apk-signature.txt
          if-no-files-found: error
          retention-days: 14
