name: Build Omega Projector APK
on:
  push:
    branches: [omega-projector-apk]
    paths:
      - 'omega-projector/**'
      - '.github/workflows/omega-projector.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip omega]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omega-projector
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack OpenGL renderer
        run: |
          mkdir -p app/src/main/java/com/omega/projector
          base64 -d packed/OmegaGLView.java.gz.b64 | gzip -d > app/src/main/java/com/omega/projector/OmegaGLView.java
      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Copy APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/OmegaProjector.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmegaProjector-APK
          path: omega-projector/dist/OmegaProjector.apk
      - name: Publish APK onto branch
        working-directory: .
        run: |
          git config user.name "Omega Builder"
          git config user.email "actions@users.noreply.github.com"
          git add omega-projector/dist/OmegaProjector.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build OmegaProjector APK [skip omega]"
            git push
          fi
