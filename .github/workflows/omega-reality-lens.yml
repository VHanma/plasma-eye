name: Build Omega Reality Lens
on:
  push:
    branches: [ omega-reality-lens-20260909 ]
    paths:
      - 'OmegaRealityLens/**'
      - '.github/workflows/omega-reality-lens.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: OmegaRealityLens
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: OmegaRealityLens-APK
          path: OmegaRealityLens/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
