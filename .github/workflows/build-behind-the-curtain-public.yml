name: Build Behind the Curtain Public APK
on:
  workflow_dispatch:
  push:
    branches: [ behind-the-curtain-download ]
    paths:
      - 'btc-public/**'
      - '.github/workflows/build-behind-the-curtain-public.yml'

concurrency:
  group: behind-the-curtain-public-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: btc-public
        run: gradle :app:assembleDebug --stacktrace
      - name: Collect APK
        shell: bash
        run: |
          mkdir -p apk-output
          cp btc-public/app/build/outputs/apk/debug/app-debug.apk apk-output/BehindTheCurtain-v1.1.apk
          sha256sum apk-output/BehindTheCurtain-v1.1.apk > apk-output/BehindTheCurtain-v1.1.apk.sha256
          ls -lh apk-output/BehindTheCurtain-v1.1.apk
          cat apk-output/BehindTheCurtain-v1.1.apk.sha256
      - name: Attach APK to workflow
        uses: actions/upload-artifact@v4
        with:
          name: BehindTheCurtain-v1.1-apk
          path: apk-output/BehindTheCurtain-v1.1.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          TAG="behind-the-curtain-v1.1-public"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" apk-output/BehindTheCurtain-v1.1.apk apk-output/BehindTheCurtain-v1.1.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" apk-output/BehindTheCurtain-v1.1.apk apk-output/BehindTheCurtain-v1.1.apk.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Behind the Curtain v1.1" --notes "Screen Sentinel: user-approved live screen analysis plus capturable playback-audio analysis, alerts, transformed speech sweeps, and evidence vault."
          fi
