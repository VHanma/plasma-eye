name: Build MaxSight x1000 APK
on:
  workflow_dispatch:
  push:
    branches: [ maxsight-x1000 ]
    paths:
      - 'maxsight-x1000/**'
      - '.github/workflows/maxsight-x1000.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'maxsight-x1000/**'
      - '.github/workflows/maxsight-x1000.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: maxsight-x1000
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp maxsight-x1000/app/build/outputs/apk/debug/app-debug.apk MaxSight-x1000-v1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MaxSight-x1000-v1.0
          path: MaxSight-x1000-v1.0.apk
          if-no-files-found: error
