name: Build Sonify Forge X v1.3 APK

on:
  push:
    branches:
      - sonifyforge-v130-build
    paths:
      - '.sonifyforge-v130-src/**'
      - '.github/workflows/sonifyforge-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify Sonify Forge X v1.3 source
        run: |
          cat .sonifyforge-v130-src/part-* > sonifyforge-x-v130-src.zip.b64
          base64 -d sonifyforge-x-v130-src.zip.b64 > sonifyforge-x-v130-src.zip
          echo 'ef7638f0b04cf39fa6f786fac4506712c987e56cc827d5357e992404776a3d6e  sonifyforge-x-v130-src.zip' | sha256sum -c -
          unzip -tq sonifyforge-x-v130-src.zip

      - name: Unpack standalone source
        run: |
          rm -rf sonifyforge-build
          mkdir sonifyforge-build
          unzip -q sonifyforge-x-v130-src.zip -d sonifyforge-build

      - name: Verify v1.3 upgrade
        run: |
          grep -q "applicationId 'com.vaanhanma.sonifyforgex'" sonifyforge-build/sonifyforge/app/build.gradle
          grep -q "versionName '1.3.0'" sonifyforge-build/sonifyforge/app/build.gradle
          grep -q 'every remaining numeric Y column is enabled' sonifyforge-build/sonifyforge/app/src/main/java/com/vaanhanma/sonifyforge/PresetCatalog.java
          grep -q 'Combat ATP DNA' sonifyforge-build/sonifyforge/app/src/main/java/com/vaanhanma/sonifyforge/PresetCatalog.java
          grep -q 'Saiyan DNA Ascension' sonifyforge-build/sonifyforge/app/src/main/java/com/vaanhanma/sonifyforge/PresetCatalog.java
          grep -q 'DNA Restoration Tone' sonifyforge-build/sonifyforge/app/src/main/java/com/vaanhanma/sonifyforge/PresetCatalog.java
          grep -q 'Scalarize all audio' sonifyforge-build/sonifyforge/app/src/main/java/com/vaanhanma/sonifyforge/MainActivity.java
          grep -q 'BEARDEN_PHASE_CONJUGATE' sonifyforge-build/sonifyforge/app/src/main/java/com/vaanhanma/sonifyforge/ScalarModes.java
          grep -q 'HI-RES SOURCE PREVIEW' sonifyforge-build/sonifyforge/app/src/main/java/com/vaanhanma/sonifyforge/GraphView.java
          test -f sonifyforge-build/sonifyforge/app/sonifyforge-release.jks

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build signed release APK
        working-directory: sonifyforge-build/sonifyforge
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Stage APK
        run: |
          mkdir -p dist
          cp sonifyforge-build/sonifyforge/app/build/outputs/apk/release/app-release.apk dist/SonifyForge-X-v1.3.0.apk
          sha256sum dist/SonifyForge-X-v1.3.0.apk | tee dist/SonifyForge-X-v1.3.0.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonifyForge-X-v1.3.0
          path: dist/*
          if-no-files-found: error
