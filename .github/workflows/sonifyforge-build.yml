name: Build Sonify Forge APK

on:
  push:
    branches:
      - standalone-sonify-forge
    paths:
      - '.sonifyforge-src/**'
      - '.github/workflows/sonifyforge-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify standalone source
        run: |
          cat .sonifyforge-src/part-* > sonifyforge-src.zip.b64
          base64 -d sonifyforge-src.zip.b64 > sonifyforge-src.zip
          echo '58f4244982a502057e262cdb45cd94087fc2bfd99a9698ba4e42ffbce0ebb9e3  sonifyforge-src.zip' | sha256sum -c -
          unzip -tq sonifyforge-src.zip

      - name: Unpack standalone source
        run: |
          rm -rf sonifyforge-build
          mkdir sonifyforge-build
          unzip -q sonifyforge-src.zip -d sonifyforge-build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build signed release APK
        working-directory: sonifyforge-build/sonifyforge
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Stage APK
        run: |
          mkdir -p dist
          cp sonifyforge-build/sonifyforge/app/build/outputs/apk/release/app-release.apk dist/SonifyForge-v1.0.0.apk
          sha256sum dist/SonifyForge-v1.0.0.apk | tee dist/SonifyForge-v1.0.0.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonifyForge-v1.0.0
          path: dist/*
          if-no-files-found: error
