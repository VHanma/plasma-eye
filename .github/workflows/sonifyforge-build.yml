name: Build Sonify Forge X APK

on:
  push:
    branches:
      - standalone-sonify-forge
    paths:
      - '.sonifyforge-v120-src/**'
      - '.github/workflows/sonifyforge-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify Sonify Forge X source
        run: |
          cat .sonifyforge-v120-src/part-* > sonifyforge-x-src.zip.b64
          base64 -d sonifyforge-x-src.zip.b64 > sonifyforge-x-src.zip
          echo '6e731e11c4580483d29682db797ac1d2d18de7f8056d6c39e22b343dafd41219  sonifyforge-x-src.zip' | sha256sum -c -
          unzip -tq sonifyforge-x-src.zip

      - name: Unpack standalone source
        run: |
          rm -rf sonifyforge-build
          mkdir sonifyforge-build
          unzip -q sonifyforge-x-src.zip -d sonifyforge-build

      - name: Verify v1.2 upgrade
        run: |
          grep -q "applicationId 'com.vaanhanma.sonifyforgex'" sonifyforge-build/sonifyforge/app/build.gradle
          grep -q "versionName '1.2.0'" sonifyforge-build/sonifyforge/app/build.gradle
          grep -q 'Japanese Edo' sonifyforge-build/sonifyforge/app/src/main/java/com/vaanhanma/sonifyforge/PresetCatalog.java
          grep -q 'UniversalFileImporter' sonifyforge-build/sonifyforge/app/src/main/java/com/vaanhanma/sonifyforge/MainActivity.java
          grep -q 'IMAGE RECONSTRUCTION' sonifyforge-build/sonifyforge/app/src/main/java/com/vaanhanma/sonifyforge/GraphView.java
          test -f sonifyforge-build/sonifyforge/app/sonifyforge-release.jks

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build signed release APK
        working-directory: sonifyforge-build/sonifyforge
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Stage APK
        run: |
          mkdir -p dist
          cp sonifyforge-build/sonifyforge/app/build/outputs/apk/release/app-release.apk dist/SonifyForge-X-v1.2.0.apk
          sha256sum dist/SonifyForge-X-v1.2.0.apk | tee dist/SonifyForge-X-v1.2.0.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonifyForge-X-v1.2.0
          path: dist/*
          if-no-files-found: error
