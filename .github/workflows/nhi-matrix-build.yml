name: Rival 3 NHI Matrix APK Forge

on:
  workflow_dispatch:
  push:
    branches:
      - rival3-nhi-matrix-build-v0.6
    paths:
      - 'nhi-build/**'
      - '.github/workflows/nhi-matrix-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Verify source microshards
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/shards.sha256 <<'EOF'
          33e4565f7320a9c7be082d8c1b956471ea8efb6c0911103d30d160813a7f5b58  nhi-build/source.b64.00
          9a7e58fc5087dffd51e322b1b4ffdd7dc2ca50943998021c888913148b86bcb1  nhi-build/source.b64.01
          a8208c4483d0ee0a3635c50400c149e5646179c9597658a6f70aead87974c7a2  nhi-build/source.b64.02.00
          5d34f7d86c53ddcd33b89180fdc21074a096fca3d779d2e21024b0fe88bacf26  nhi-build/source.b64.02.01
          8d3b62885404a4d40b0fe9a7a7bb463e3a1057881d30a824a85ce729f6c62d32  nhi-build/source.b64.02.02
          6d44cd7274c4a50691ff5b3675067b705bbb2334a8c85f3a92a54ffaa95d897d  nhi-build/source.b64.02.03
          a87b78b84403cfa534f94543b202ee0945590122ad718af79135500ee070fbd2  nhi-build/source.b64.03
          742d320058a8d751755a637d79760a19a7e6f5fbd37c4d02f186b53846f221ac  nhi-build/source.b64.04
          fa78a0c4b6ea0b23fd85a1e1b9052e4ceaaeb2e5cbafbd59134f203f00309d43  nhi-build/source.b64.05.00.0
          beac0da91688851519623e2845385dc354487515b60087941fd356bcbb21f9ad  nhi-build/source.b64.05.00.1
          4e742622b1b57694dfe200f5613eb900ce99798555fce5548381aa69495b715f  nhi-build/source.b64.05.00.2
          fdc1f979cc13d73d6636863ae898e92eef8e62bba0ddb3b1431cee256e12f019  nhi-build/source.b64.05.00.3
          b4f0b891f861d621daca7cbf6441f84fa6df6fa866e2aee0019fe2801db17b83  nhi-build/source.b64.05.01
          b9324142f2b63da39443aaa358d73ce176c351c345d8a8cf2635ac17c5c059b0  nhi-build/source.b64.05.02
          e5d025fa030e59516db10a4c710f49ba399a9b8f14116b109741130c216f8e2a  nhi-build/source.b64.05.03
          a87e24ed9ee1d0e38c7e62b9982e05999a4b4b3ca65d3607311f61f48afe685c  nhi-build/source.b64.06.00
          5dd975bb16ce59c5fa249ecd60bc38a5e0f8fdd2e58c0f35a12e33fa9522e9f6  nhi-build/source.b64.06.01
          9c2c2c3063d62665c808c8bdfa3aa5c2c2ace56bdcebc0395a8b5a58d5f77d7b  nhi-build/source.b64.06.02
          3fc760117d5bec950e3b8cc3fb670b3b1221a9b88f14e4414672d961f03ed9ca  nhi-build/source.b64.06.03.0
          cd940ed6c48fc549106211416c39c6d2c2d8a7ed31c76ad1978495bbf782664f  nhi-build/source.b64.06.03.1
          26c35a7827968507d50459b4a117e490830c37d2f04e65bbd469fcc46b05dbe4  nhi-build/source.b64.06.03.2
          1d304d0dd257ad868f92b04441ebf077380625e26b76d7b372d67d8bdf60bfc7  nhi-build/source.b64.06.03.3
          ff96e7fac1212f30338dae7310ff79dea410975066ae368bf0dcd9e93b6f062c  nhi-build/source.b64.07.00
          13ca82eb605a626790ba64860795cc2533e10f30c04e42fe7a192cc9ba69eeac  nhi-build/source.b64.07.01
          70e9cca8d7e525bac0face2a86a8c8a46cf039bd238f8f9cd71ec9271cc61561  nhi-build/source.b64.07.02
          EOF
          sha256sum -c /tmp/shards.sha256

      - name: Reconstruct and verify NHI Matrix source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          parts = [
              'source.b64.00','source.b64.01',
              'source.b64.02.00','source.b64.02.01','source.b64.02.02','source.b64.02.03',
              'source.b64.03','source.b64.04',
              'source.b64.05.00.0','source.b64.05.00.1','source.b64.05.00.2','source.b64.05.00.3',
              'source.b64.05.01','source.b64.05.02','source.b64.05.03',
              'source.b64.06.00','source.b64.06.01','source.b64.06.02',
              'source.b64.06.03.0','source.b64.06.03.1','source.b64.06.03.2','source.b64.06.03.3',
              'source.b64.07.00','source.b64.07.01','source.b64.07.02',
          ]
          root = Path('nhi-build')
          text = ''.join((root / name).read_text(encoding='ascii') for name in parts)
          assert len(text) == 90928, f'Unexpected Base64 length: {len(text)}'
          raw = base64.b64decode(text, validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          assert digest == '4ef025585f9f679cf07d9c6879efd4a5ceb155e249b8b914f025d6b843aaca63', digest
          Path('/tmp/nhi-source.zip').write_bytes(raw)
          print('Source ZIP SHA-256:', digest)
          PY
          unzip -t /tmp/nhi-source.zip
          rm -rf /tmp/nhi-src
          mkdir -p /tmp/nhi-src
          unzip -q /tmp/nhi-source.zip -d /tmp/nhi-src
          test -f /tmp/nhi-src/NHI-Matrix-Lab/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 preview platform
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list --channel=3 > /tmp/sdk-list.txt
          grep -E 'platforms;android-(37|CinnamonBun)|build-tools;37' /tmp/sdk-list.txt | head -40 || true
          PLATFORM_PACKAGE="$(grep -oE 'platforms;android-(37|CinnamonBun)' /tmp/sdk-list.txt | head -1 || true)"
          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo 'Android 17 preview platform package was not exposed by sdkmanager --channel=3'
            exit 1
          fi
          echo "Installing preview platform: $PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE" 'platform-tools' 'build-tools;36.0.0'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build installable debug APK
        shell: bash
        working-directory: /tmp/nhi-src/NHI-Matrix-Lab
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/nhi-src/NHI-Matrix-Lab/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee /tmp/NHI-Matrix-Lab-debug.apk.sha256
          cp "$APK" /tmp/NHI-Matrix-Lab-v0.5.0-rival3-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NHI-Matrix-Lab-v0.5.0-rival3-debug
          path: |
            /tmp/NHI-Matrix-Lab-v0.5.0-rival3-debug.apk
            /tmp/NHI-Matrix-Lab-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
