name: Rival 3 NHI Matrix APK Forge

on:
  workflow_dispatch:
  push:
    branches:
      - rival3-nhi-matrix-build-v0.6
    paths:
      - 'nhi-build/**'
      - '.github/workflows/nhi-matrix-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Verify source shards
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/shards.sha256 <<'EOF'
          33e4565f7320a9c7be082d8c1b956471ea8efb6c0911103d30d160813a7f5b58  nhi-build/source.b64.00
          9a7e58fc5087dffd51e322b1b4ffdd7dc2ca50943998021c888913148b86bcb1  nhi-build/source.b64.01
          73b1c203b27acdabbaa102e66b09c880ae084b0f13f128a071368bb028d00a53  nhi-build/source.b64.02
          a87b78b84403cfa534f94543b202ee0945590122ad718af79135500ee070fbd2  nhi-build/source.b64.03
          742d320058a8d751755a637d79760a19a7e6f5fbd37c4d02f186b53846f221ac  nhi-build/source.b64.04
          f8256e5bccced88bc612ff928a3f9591ee7f0843fbba7c6e7d9aaea6d4cce7c2  nhi-build/source.b64.05
          387335414ce86f0d3835264c76c124ce10ef91332126e0742cc59a8977a51c1e  nhi-build/source.b64.06
          b0d9c2acfb4324a7eecaa9bf1b6a60092155556e0ccd6249adceafe2ba67059e  nhi-build/source.b64.07
          EOF
          sha256sum -c /tmp/shards.sha256
          wc -c nhi-build/source.b64.*

      - name: Reconstruct and verify NHI Matrix source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          parts = sorted(Path('nhi-build').glob('source.b64.*'))
          text = ''.join(p.read_text(encoding='ascii') for p in parts)
          assert len(text) == 90928, f'Unexpected Base64 length: {len(text)}'
          raw = base64.b64decode(text, validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          assert digest == '4ef025585f9f679cf07d9c6879efd4a5ceb155e249b8b914f025d6b843aaca63', digest
          Path('/tmp/nhi-source.zip').write_bytes(raw)
          print('Source ZIP SHA-256:', digest)
          PY
          unzip -t /tmp/nhi-source.zip
          rm -rf /tmp/nhi-src
          mkdir -p /tmp/nhi-src
          unzip -q /tmp/nhi-source.zip -d /tmp/nhi-src
          test -f /tmp/nhi-src/NHI-Matrix-Lab/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-37' 'build-tools;36.0.0'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build installable debug APK
        shell: bash
        working-directory: /tmp/nhi-src/NHI-Matrix-Lab
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/nhi-src/NHI-Matrix-Lab/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee /tmp/NHI-Matrix-Lab-debug.apk.sha256
          cp "$APK" /tmp/NHI-Matrix-Lab-v0.5.0-rival3-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NHI-Matrix-Lab-v0.5.0-rival3-debug
          path: |
            /tmp/NHI-Matrix-Lab-v0.5.0-rival3-debug.apk
            /tmp/NHI-Matrix-Lab-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
