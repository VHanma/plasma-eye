name: Build Liar AI APK

on:
  workflow_dispatch:
  push:
    branches: [ liar-ai-v1 ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Ensure Android 34 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build Liar AI release APK
        run: |
          chmod +x gradlew
          ./gradlew :liarai:assembleRelease --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          APK="$(find liarai/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" LiarAI-v1.0.apk
          sha256sum LiarAI-v1.0.apk > LiarAI-v1.0.apk.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: liar-ai-v1.0
          path: |
            LiarAI-v1.0.apk
            LiarAI-v1.0.apk.sha256

      - name: Publish public release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: liar-ai-v1.0-public
        shell: bash
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Liar AI v1.0" \
              --notes "Android port inspired by ruvnet's multi-modal Liar AI gist. Live camera motion/face-jitter analysis, vocal stress features, text cue analysis, late fusion, baseline calibration, speech input, and local JSONL logging."
          gh release upload "$TAG" \
            LiarAI-v1.0.apk \
            LiarAI-v1.0.apk.sha256 \
            --clobber
